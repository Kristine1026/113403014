<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JS Object Property Management</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; }
        .output { background: #f4f4f4; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
        code { font-weight: bold; color: #d63384; }
    </style>
</head>
<body>

    <h2>JavaScript Object Properties</h2>
    
    <div class="output">
        <strong>Original Properties:</strong>
        <p id="original-list"></p>
    </div>

    <div class="output">
        <strong>Object After Deleting <code>age</code>:</strong>
        <pre id="final-object"></pre>
    </div>

    <script>
        // Sample object from image_39c216.png
        var Person = {
            firstName: "Tony",
            lastName: "Lee",
            age: 50,
            eyeColor: "Blue"
        };

        // 1. List all properties
        const properties = Object.keys(Person).join(", ");
        document.getElementById("original-list").textContent = properties;

        // 2. Delete the age property
        delete Person.age;

        // 3. Print the object after deleting the property
        document.getElementById("final-object").textContent = JSON.stringify(Person, null, 4);
        
        // Also logging to console for verification
        console.log("Updated Person Object:", Person);
    </script>
</body>
</html>
