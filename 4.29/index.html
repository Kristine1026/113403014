<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Button Page</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .container {
            border: 1px solid #ccc;
            padding: 40px;
            text-align: center;
            width: 200px;
        }
        #text-display {
            font-size: 2rem;
            margin-bottom: 20px;
            height: 50px; /* Prevents layout jump when text changes */
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="text-display">Hello</div>
        <button id="action-btn">Button</button>
    </div>

    <script>
        const textDisplay = document.getElementById('text-display');
        const btn = document.getElementById('action-btn');

        // 1. Mouse Over: Change text color to pink
        btn.addEventListener('mouseover', () => {
            textDisplay.style.color = 'magenta';
        });

        // 2. Mouse Out: (Optional) Revert color when mouse leaves
        btn.addEventListener('mouseout', () => {
            // Only revert if it hasn't been clicked yet
            if (textDisplay.innerText !== 'Mouse Click') {
                textDisplay.style.color = 'black';
            }
        });

        // 3. Mouse Click: Change text content and keep color pink
        btn.addEventListener('click', () => {
            textDisplay.innerText = 'Mouse Click';
            textDisplay.style.color = 'magenta';
        });
    </script>

</body>
</html>
