<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>表單驗證練習</title>
</head>
<body>

    <h2>Please input a number between 150 and 300:</h2>

    <input id="numberInput" type="text">
    
    <button type="button" onclick="validate()">Submit</button>

    <p id="message"></p>

    <script>
        function validate() {
            // 1. 取得輸入框的值
            const x = document.getElementById("numberInput").value;
            let text;

            // 2. 判斷邏輯
            if (isNaN(x) || x === "") {
                text = "Input not a number";
            } else if (x < 150) {
                text = "Value too small";
            } else if (x > 300) {
                text = "Value too large";
            } else {
                text = "Input OK";
            }

            // 3. 把結果顯示在頁面上
            document.getElementById("message").innerHTML = text;
        }
    </script>

</body>
</html>
