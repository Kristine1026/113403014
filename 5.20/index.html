<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Calculations Demonstration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f7f6;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            text-align: center;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: center;
        }
        input[type="number"] {
            padding: 8px;
            width: 120px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 8px 15px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .output-box {
            background-color: #fff;
            padding: 15px;
            border-left: 5px solid #28a745;
            margin-top: 15px;
            border-radius: 4px;
        }
        p {
            margin: 8px 0;
            font-size: 18px;
            color: #555;
        }
    </style>
</head>
<body>

    <h2>Circle Properties Calculator</h2>
    
    <div class="input-group">
        <label for="radiusInput">Enter Radius: </label>
        <input type="number" id="radiusInput" value="5" min="0" step="any">
        <button onclick="runCalculations()">Calculate</button>
    </div>

    <div class="output-box">
        <p id="circumferenceResult">The circumference is NN</p>
        <p id="areaResult">The area is NN</p>
    </div>

    <script>
        // Note: The prompt misspelled it as 'calcCircumfrence', so we use exactly that naming convention.
        function calcCircumfrence(radius) {
            // Formula: 2 * pi * r
            const circumference = 2 * Math.PI * radius;
            
            // Output to the webpage, rounded to 2 decimal places for neatness
            document.getElementById("circumferenceResult").innerText = `The circumference is ${circumference.toFixed(2)}`;
        }

        function calcArea(radius) {
            // Formula: pi * r^2
            const area = Math.PI * Math.pow(radius, 2);
            
            // Output to the webpage, rounded to 2 decimal places for neatness
            document.getElementById("areaResult").innerText = `The area is ${area.toFixed(2)}`;
        }

        // Helper function triggered by the button click to fetch user input and run both calculations
        function runCalculations() {
            const radius = parseFloat(document.getElementById("radiusInput").value);
            
            if (isNaN(radius) || radius < 0) {
                alert("Please enter a valid positive number for the radius.");
                return;
            }

            // Execute the two mandatory functions from the instructions
            calcCircumfrence(radius);
            calcArea(radius);
        }

        // Run initially once on load with the default input value of 5
        runCalculations();
    </script>

</body>
</html>
